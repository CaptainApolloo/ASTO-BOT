<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <div class="section">Translator</div>

  <div class="sdpi-item">
    <div class="sdpi-item-label">Action</div>
    <select class="sdpi-item-value" id="fMode">
      <option value="toggle">Toggle on / off</option>
      <option value="on">Turn on</option>
      <option value="off">Turn off</option>
    </select>
  </div>
  <div class="hint">
    Controls the live translator itself. The output switches (subtitles, GDI,
    chat) and the subtitle window have their own commands under the
    <b>Command</b> action.
  </div>

  <div class="section">Connection</div>
  <div id="connBox"></div>

  <script src="../js/pi-common.js"></script>
  <script>
    'use strict';
    const f = document.getElementById('fMode');
    f.addEventListener('change', function () {
      piSettings.mode = f.value;
      saveSettings();
    });
    onSettingsReady = function () {
      if (!piSettings.mode) { piSettings.mode = 'toggle'; saveSettings(); }
      f.value = piSettings.mode;
    };
    renderConnectionBlock();
  </script>
</body>
</html>
