<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="pi.css" />
</head>
<body>
  <div class="section">Script</div>

  <div id="pickBox"></div>

  <div class="sdpi-item">
    <div class="sdpi-item-label">Script name</div>
    <input class="sdpi-item-value" id="fName" type="text" placeholder="my_script">
  </div>
  <div class="hint">
    Pick from the list above, or type the name. The list is read live from
    ASTO-BOT — if it stays empty, the app is closed or its websocket is off.
  </div>

  <div class="section">Connection</div>
  <div id="connBox"></div>

  <script src="../js/pi-common.js"></script>
  <script>
    'use strict';
    const f = document.getElementById('fName');
    f.addEventListener('change', function () {
      piSettings.name = f.value;
      saveSettings();
    });
    onSettingsReady = function () { f.value = piSettings.name || ''; };
    renderConnectionBlock();
    document.getElementById('pickBox').appendChild(createListPicker('scripts', f));
  </script>
</body>
</html>
